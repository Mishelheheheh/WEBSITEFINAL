<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASS LIBRARY</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- This is a header. -->
    <header>
       <img src="logo1.png" alt="coffee logo" class="logo">

   <!-- This is the main. -->

            </div>
            <div class="coffee-text">
                <img src="americano.png" alt="Americano Coffe" class="americano">

            <div class="coffee-text">
                <img src="macchiato.png" alt="Macchiato" class="Macchiato">

           <!-- This is the second section  -->
    </section>

        </div>

        <img src="logo1.png" class="logo">
